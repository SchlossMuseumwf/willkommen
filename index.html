<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Museum Wolfenbüttel</title>
    <style>
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow-x: hidden; overflow-y: hidden;
            font-family: Arial, sans-serif;
        }
        /* Фоновое изображение */
        .background {
            position: absolute; inset: 0;
            background: url('watermark.png') no-repeat center center;
            background-size: cover; z-index: 0;
        }
        /* Полупрозрачный белый слой */
        .overlay {
            position: absolute; inset: 0;
            background-color: rgba(255,255,255,0.7);
            z-index: 1;
        }
        /* Контейнер кнопок */
        .container {
            position: absolute; z-index: 2;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
            box-sizing: border-box;
            width: min(860px, calc(100% - 24px));
            max-height: calc(100% - 24px);
            padding: 10px 8px 16px;
            overflow-y: auto;
        }
        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-height: 76px;
            padding: 18px 14px;
            text-align: center;
            font-size: 22px; font-weight: bold;
            line-height: 1.2;
            color: #fff; text-decoration: none;
            border: 1px solid #650c14;
            border-radius: 18px;
            background: linear-gradient(180deg, #ac3038 0%, #8b101c 55%, #800000 100%);
            box-shadow: 0 6px 0 #4e000a, 0 10px 18px rgba(66, 15, 12, .22), inset 0 2px 0 rgba(255, 255, 255, .24);
            text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transition: transform .12s, box-shadow .12s, filter .12s;
        }
        @media (hover: hover) {
            .button:hover { filter: brightness(1.12); }
        }
        .button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4e000a, 0 4px 8px rgba(66, 15, 12, .2), inset 0 1px 0 rgba(255, 255, 255, .18);
        }
        .button:focus-visible { outline: 3px solid #155749; outline-offset: 5px; }
        @media (prefers-reduced-motion: reduce) {
            .button { transition: none; }
            .floating-text { display: none; }
        }

        /* Плавающий «дырочный» текст */
        .floating-text {
            position: absolute;
            white-space: nowrap;
            font-size: 10vw;            /* можно уменьшить при желании */
            font-weight: bold;
            color: rgba(0,0,0,0);        /* прозрачный текст */
            background: url('watermark.png') no-repeat fixed center;
            background-size: cover;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none;
            user-select: none;
        }

        /* Адаптив: уменьшим размер фраз на очень узких экранах */
        @media (max-width: 600px) {
            .floating-text { font-size: 14vw; }
            .container { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
            .button { min-height: 62px; font-size: 18px; padding: 16px 8px; border-radius: 16px; }
        }
    </style>
</head>
<body>
    <!-- Задний фон -->
    <div class="background"></div>
    <!-- Полупрозрачный слой -->
    <div class="overlay"></div>

    <!-- Кнопки языков -->
    <div class="container">
        <a href="https://schlossmuseumwf.github.io/Zahlen/"   class="button">Deutsch</a>
        <a href="https://schlossmuseumwf.github.io/Numbers/"  class="button">English</a>
        <a href="https://schlossmuseumwf.github.io/Nombres/"  class="button">Français</a>
        <a href="https://schlossmuseumwf.github.io/Numeros/"  class="button">Español</a>
        <a href="https://schlossmuseumwf.github.io/willkommen/pl/" class="button" lang="pl">Polski</a>
        <a href="https://schlossmuseumwf.github.io/Getallen/" class="button">Nederlands</a>
        <a href="https://schlossmuseumwf.github.io/NumbersRU/"class="button">Русский</a>
        <a href="https://schlossmuseumwf.github.io/Numeri/"   class="button">Italiano</a>
        <a href="https://schlossmuseumwf.github.io/Tal/"      class="button">Dansk</a>
        <a href="https://schlossmuseumwf.github.io/Shuzi/"    class="button">中文</a>
        <a href="https://schlossmuseumwf.github.io/willkommen/sv/" class="button" lang="sv">Svenska</a>
    </div>

    <script>
        // Фразы на всех языках, в том же порядке, что и кнопки
        const phrases = [
            "Willkommen im Museum Wolfenbüttel",       // Deutsch
            "Welcome to the Museum Wolfenbüttel",      // English
            "Bienvenue au Musée Wolfenbüttel",         // Français
            "Bienvenido al Museo Wolfenbüttel",        // Español
            "Witamy w Muzeum w Wolfenbüttel",             // Polski
            "Welkom in het Museum Wolfenbüttel",       // Nederlands
            "Добро пожаловать в музей Вольфенбюттеля", // Русский
            "Benvenuto al Museo Wolfenbüttel",         // Italiano
            "Velkommen til Museum Wolfenbüttel",       // Dansk
            "欢迎来到沃尔芬比特尔博物馆",                    // 中文
            "Välkommen till Museum Wolfenbüttel"        // Svenska
        ];

        const fonts = [
            "Arial, sans-serif",
            "Georgia, serif",
            "Courier New, monospace",
            "Times New Roman, serif",
            "Verdana, sans-serif",
            "Trebuchet MS, sans-serif"
        ];

        const overlay = document.querySelector('.overlay');

        // Распределяем все языки между тремя частями экрана
        const frameIds = new Set();
        const thirds = [
            { start: 0.05, end: 0.30 }, // верх
            { start: 0.35, end: 0.65 }, // середина
            { start: 0.70, end: 0.95 }  // низ
        ];

        function createFloatingText({ phrase, y, direction, font, speed }) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = phrase;
            el.style.fontFamily = font;
            el.style.top = y + 'px';
            overlay.appendChild(el);

            // Стартовая X снаружи экрана, в зависимости от направления
            let x = direction > 0 ? -el.offsetWidth - 50 : window.innerWidth + 50;
            el.style.left = x + 'px';

            let lastTime = null;
            let frameId = null;
            function tick(ts) {
                if (frameId !== null) frameIds.delete(frameId);
                if (!lastTime) lastTime = ts;
                const dt = (ts - lastTime) / 16.7; // нормируем к ~60fps
                lastTime = ts;

                x += direction * speed * dt;
                el.style.left = x + 'px';

                // Зацикливание
                if (direction > 0 && x > window.innerWidth + 50) {
                    x = -el.offsetWidth - 50;
                } else if (direction < 0 && x < -el.offsetWidth - 50) {
                    x = window.innerWidth + 50;
                }
                frameId = requestAnimationFrame(tick);
                frameIds.add(frameId);
            }
            frameId = requestAnimationFrame(tick);
            frameIds.add(frameId);
        }

        function setup() {
            const H = window.innerHeight;
            frameIds.forEach(id => cancelAnimationFrame(id));
            frameIds.clear();

            // Чистим предыдущие, если пересоздаём при ресайзе
            overlay.querySelectorAll('.floating-text').forEach(n => n.remove());

            let langIndex = 0;
            thirds.forEach((t, tIdx) => {
                const rowsPerThird = Math.floor(phrases.length / thirds.length)
                    + (tIdx < phrases.length % thirds.length ? 1 : 0);
                if (!rowsPerThird) return;
                const yStart = H * t.start;
                const yEnd   = H * t.end;
                const rowH   = (yEnd - yStart) / rowsPerThird;

                for (let r = 0; r < rowsPerThird; r++) {
                    // Берём фразу по порядку, чтобы каждый язык точно показался
                    const phrase = phrases[langIndex % phrases.length];
                    const font   = fonts[(langIndex * 3) % fonts.length];

                    // Чередуем направление строк: →, ←, →, ← …
                    const direction = (langIndex % 2 === 0) ? 1 : -1;

                    // Лёгкая вариация скорости, базовая ~2..3 px/кадр
                    const speed = 0.5 + (langIndex % 3) * 0.6 + Math.random() * 0.4;

                    // Позиция по Y — по центру строки
                    const y = yStart + r * rowH + rowH / 2;

                    createFloatingText({ phrase, y, direction, font, speed });
                    langIndex++;
                }
            });
        }

        // Инициализация и обновление при ресайзе
        setup();
        window.addEventListener('resize', () => {
            // Дадим браузеру завершить текущий рефлоу
            clearTimeout(window.__ft_resize_timer);
            window.__ft_resize_timer = setTimeout(setup, 150);
        });
    </script>
</body>
</html>
