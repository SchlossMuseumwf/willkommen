<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Museum Wolfenbüttel</title>
    <style>
        html, body {
            width: 100%; height: 100%;
            margin: 0; padding: 0;
            overflow-x: hidden; overflow-y: hidden;
            font-family: Arial, sans-serif;
        }
        /* Фоновое изображение */
        .background {
            position: absolute; inset: 0;
            background: url('watermark.png') no-repeat center center;
            background-size: cover; z-index: 0;
        }
        /* Полупрозрачный белый слой */
        .overlay {
            position: absolute; inset: 0;
            background-color: rgba(255,255,255,0.7);
            z-index: 1;
        }
        /* Контейнер кнопок */
        .container {
            position: absolute; z-index: 2;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .button {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            width: 150px;
            text-align: center;
            font-size: 18px; font-weight: bold;
            color: #fff; text-decoration: none;
            border-radius: 5px;
            background-color: #8B0000;
            cursor: pointer; transition: background-color .3s;
        }
        .button:hover { background-color: #5A0000; }

        /* Плавающий «дырочный» текст */
        .floating-text {
            position: absolute;
            white-space: nowrap;
            font-size: 10vw;            /* можно уменьшить при желании */
            font-weight: bold;
            color: rgba(0,0,0,0);        /* прозрачный текст */
            background: url('watermark.png') no-repeat fixed center;
            background-size: cover;
            -webkit-background-clip: text;
            background-clip: text;
            pointer-events: none;
            user-select: none;
        }

        /* Адаптив: уменьшим размер фраз на очень узких экранах */
        @media (max-width: 600px) {
            .floating-text { font-size: 14vw; }
            .button { width: 140px; font-size: 16px; padding: 12px 24px; }
        }
    </style>
</head>
<body>
    <!-- Задний фон -->
    <div class="background"></div>
    <!-- Полупрозрачный слой -->
    <div class="overlay"></div>

    <!-- Кнопки языков -->
    <div class="container">
        <a href="https://schlossmuseumwf.github.io/Zahlen/"   class="button">Deutsch</a>
        <a href="https://schlossmuseumwf.github.io/Numbers/"  class="button">English</a>
        <a href="https://schlossmuseumwf.github.io/Nombres/"  class="button">Français</a>
        <a href="https://schlossmuseumwf.github.io/Numeros/"  class="button">Español</a>
        <a href="https://schlossmuseumwf.github.io/Getallen/" class="button">Nederlands</a>
        <a href="https://schlossmuseumwf.github.io/NumbersRU/"class="button">Русский</a>
        <a href="https://schlossmuseumwf.github.io/Numeri/"   class="button">Italiano</a>
        <a href="https://schlossmuseumwf.github.io/Tal/"      class="button">Dansk</a>
        <a href="https://schlossmuseumwf.github.io/Shuzi/"    class="button">中文</a>
    </div>

    <script>
        // Фразы на всех языках, в том же порядке, что и кнопки
        const phrases = [
            "Willkommen im Museum Wolfenbüttel",       // Deutsch
            "Welcome to the Museum Wolfenbüttel",      // English
            "Bienvenue au Musée Wolfenbüttel",         // Français
            "Bienvenido al Museo Wolfenbüttel",        // Español
            "Welkom in het Museum Wolfenbüttel",       // Nederlands
            "Добро пожаловать в музей Вольфенбюттеля", // Русский
            "Benvenuto al Museo Wolfenbüttel",         // Italiano
            "Velkommen til Museum Wolfenbüttel",       // Dansk
            "欢迎来到沃尔芬比特尔博物馆"                     // 中文
        ];

        const fonts = [
            "Arial, sans-serif",
            "Georgia, serif",
            "Courier New, monospace",
            "Times New Roman, serif",
            "Verdana, sans-serif",
            "Trebuchet MS, sans-serif"
        ];

        const overlay = document.querySelector('.overlay');

        // Создаём 9 строк (3 в каждой трети экрана), каждая строка — свой язык
        const rowsPerThird = 3; // итого 9 строк (3*3)
        const thirds = [
            { start: 0.05, end: 0.30 }, // верх
            { start: 0.35, end: 0.65 }, // середина
            { start: 0.70, end: 0.95 }  // низ
        ];

        function createFloatingText({ phrase, y, direction, font, speed }) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.textContent = phrase;
            el.style.fontFamily = font;
            el.style.top = y + 'px';
            overlay.appendChild(el);

            // Стартовая X снаружи экрана, в зависимости от направления
            let x = direction > 0 ? -el.offsetWidth - 50 : window.innerWidth + 50;
            el.style.left = x + 'px';

            let lastTime = null;
            function tick(ts) {
                if (!lastTime) lastTime = ts;
                const dt = (ts - lastTime) / 16.7; // нормируем к ~60fps
                lastTime = ts;

                x += direction * speed * dt;
                el.style.left = x + 'px';

                // Зацикливание
                if (direction > 0 && x > window.innerWidth + 50) {
                    x = -el.offsetWidth - 50;
                } else if (direction < 0 && x < -el.offsetWidth - 50) {
                    x = window.innerWidth + 50;
                }
                requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        function setup() {
            const H = window.innerHeight;

            // Чистим предыдущие, если пересоздаём при ресайзе
            overlay.querySelectorAll('.floating-text').forEach(n => n.remove());

            let langIndex = 0;
            thirds.forEach((t, tIdx) => {
                const yStart = H * t.start;
                const yEnd   = H * t.end;
                const rowH   = (yEnd - yStart) / rowsPerThird;

                for (let r = 0; r < rowsPerThird; r++) {
                    // Берём фразу по порядку, чтобы каждый язык точно показался
                    const phrase = phrases[langIndex % phrases.length];
                    const font   = fonts[(langIndex * 3) % fonts.length];

                    // Чередуем направление строк: →, ←, →, ← …
                    const direction = (langIndex % 2 === 0) ? 1 : -1;

                    // Лёгкая вариация скорости, базовая ~2..3 px/кадр
                    const speed = 2 + (langIndex % 3) * 0.6 + Math.random() * 0.4;

                    // Позиция по Y — по центру строки
                    const y = yStart + r * rowH + rowH / 2;

                    createFloatingText({ phrase, y, direction, font, speed });
                    langIndex++;
                }
            });
        }

        // Инициализация и обновление при ресайзе
        setup();
        window.addEventListener('resize', () => {
            // Дадим браузеру завершить текущий рефлоу
            clearTimeout(window.__ft_resize_timer);
            window.__ft_resize_timer = setTimeout(setup, 150);
        });
    </script>
</body>
</html>
